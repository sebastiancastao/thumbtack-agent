name: Thumbtack agent

# Runs the message-check-and-reply agent headlessly, every 5 minutes, but
# only during 8pm-8am America/New_York (Georgia) time -- i.e. outside the
# hours the human team already covers (see REPLY_MESSAGE in
# scripts/lib/thumbtack-inbox.mjs). It can't run inside Vercel/Supabase Edge
# Functions (no persistent process, no room for a real Chromium binary), so
# it runs here on a schedule instead. See scripts/thumbtack-agent-headless.mjs.
#
# GitHub Actions cron only understands UTC, and US Eastern time shifts
# between UTC-4 (EDT) and UTC-5 (EST) with daylight saving, so a fixed UTC
# cron window would drift by an hour twice a year. Instead: the cron trigger
# below fires every 5 minutes across a generous UTC superset of the target
# window (00:00-13:59 UTC, which covers 8pm-8am Eastern in both EST and
# EDT), and the "Check active window" step does the precise, DST-aware
# check using the actual America/New_York timezone before anything else
# runs.
on:
  schedule:
    - cron: "*/5 0-13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even outside the 8pm-8am window (for testing)"
        type: boolean
        default: false
      dry_run:
        description: "Report unanswered messages but don't actually reply (for testing)"
        type: boolean
        default: true

concurrency:
  group: thumbtack-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # THUMBTACK_STORAGE_STATE lives in this environment's secrets, not the
    # repo's — on a public repo, an environment secret is only readable by a
    # job that explicitly opts in here, instead of every workflow in the repo.
    # Do NOT add required-reviewer/wait-timer protection rules to this
    # environment: this job must run unattended on every schedule tick.
    environment: thumbtack-agent
    steps:
      - name: Check active window (8pm-8am America/New_York)
        id: window
        env:
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          hour=$(TZ='America/New_York' date +%H)
          hour=$((10#$hour))
          if [ "$hour" -ge 20 ] || [ "$hour" -lt 8 ] || [ "$FORCE_RUN" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current America/New_York hour: $hour (force=$FORCE_RUN)"

      - name: Check Thumbtack session secret
        if: steps.window.outputs.active == 'true'
        env:
          THUMBTACK_STORAGE_STATE: ${{ secrets.THUMBTACK_STORAGE_STATE }}
        run: |
          if [ -z "$THUMBTACK_STORAGE_STATE" ]; then
            echo "Missing THUMBTACK_STORAGE_STATE secret."
            echo "Create/update it under Settings -> Environments -> thumbtack-agent -> Environment secrets."
            exit 1
          fi
          echo "THUMBTACK_STORAGE_STATE secret is configured."

      - uses: actions/checkout@v5
        if: steps.window.outputs.active == 'true'

      - uses: actions/setup-node@v5
        if: steps.window.outputs.active == 'true'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.window.outputs.active == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run agent
        if: steps.window.outputs.active == 'true'
        env:
          THUMBTACK_STORAGE_STATE: ${{ secrets.THUMBTACK_STORAGE_STATE }}
          # Empty on scheduled runs (no inputs), which correctly resolves to
          # "not a dry run" -- only workflow_dispatch sets this explicitly.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/thumbtack-agent-headless.mjs

      - name: Upload results
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unanswered-messages
          path: logs/unanswered-messages.json
          if-no-files-found: ignore
          retention-days: 14
